services:
  api:
    build:
      context: ..
      dockerfile: reup-editor-node/Dockerfile
    image: reup-editor-node:local
    container_name: reup-editor-node-api
    command: ["api"]
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - REDIS_URL=redis://reup-redis:6379/0
    ports:
      - "8103:8000"
    volumes:
      - ./data/source:/source
      - ./data/outputs:/outputs
      - ./dialogue.yaml:/config/dialogue.yaml:ro
      - ./data/music:/music
      - ./data/style:/style
    networks:
      - reup-net

  worker:
    build:
      context: ..
      dockerfile: reup-editor-node/Dockerfile
    image: reup-editor-node:local
    container_name: reup-editor-node-worker
    command: ["worker"]
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - REDIS_URL=redis://reup-redis:6379/0
      - EVENT_LOG_ENABLED=true
    volumes:
      - ./data/source:/source
      - ./data/outputs:/outputs
      - ./dialogue.yaml:/config/dialogue.yaml:ro
      - ./data/music:/music:ro
      - ./data/logs:/logs
    networks:
      - reup-net

networks:
  reup-net:
    external: true
