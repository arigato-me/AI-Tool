server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy sang reup-orchestrator-node-api — tránh phải bật CORS trên FastAPI,
    # trình duyệt chỉ thấy 1 origin duy nhất (chính nginx này).
    #
    # proxy_pass với hostname literal khiến nginx resolve DNS 1 lần lúc START UP — nếu
    # reup-orchestrator-node-api chưa "up" tại thời điểm đó (thứ tự start khác nhau, đang
    # restart...), nginx crash luôn (`host not found in upstream`), kéo theo cả static UI cũng
    # sập dù không liên quan tới API. Dùng resolver DNS nội bộ của Docker (127.0.0.11) + biến
    # trong proxy_pass để hoãn resolve tới lúc có request thật — nginx start được ngay cả khi
    # orchestrator chưa sẵn sàng, chỉ request /api/* mới lỗi cho tới khi orchestrator lên.
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        # Dùng biến trong proxy_pass tắt luôn hành vi tự strip prefix location của nginx —
        # phải tự `rewrite ... break` để bỏ "/api/" trước khi forward, nếu không backend
        # (không có prefix "/api") sẽ nhận nguyên "/api/health" và trả 404.
        # Lưu ý thứ tự: `set` phải đứng TRƯỚC `rewrite ... break` — `break` dừng toàn bộ
        # directive còn lại của rewrite-module trong phase này, kể cả `set` đứng sau nó
        # (gặp lỗi thật: "using uninitialized ... variable" khi đặt set sau break).
        set $orchestrator_upstream reup-orchestrator-node-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$orchestrator_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        # Upload nhạc nền/audio mẫu clone giọng đi base64-over-JSON (~30MB file -> ~40MB
        # base64) — mặc định nginx chỉ cho 1MB, thiếu dòng này mọi upload sẽ bị 413.
        client_max_body_size 64m;
    }

    # SPA fallback — mọi route không khớp file tĩnh đều trả index.html, để hash-routing
    # phía client (App.tsx) tự xử lý.
    location / {
        try_files $uri /index.html;
    }
}
