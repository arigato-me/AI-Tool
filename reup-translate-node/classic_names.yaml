# Bảng tên riêng + biệt danh cho tác phẩm kinh điển Trung Quốc hay bị reup (Thủy Hử, Tam Quốc
# Diễn Nghĩa, Tây Du Ký, Kim Dung...) — xem build_classic_glossary_note() / CLASSIC_NAME_GLOSSARY
# bên translate_cli.py. Sửa/thêm trực tiếp file này (mount read-only vào container, đọc lại MỖI
# LẦN chạy job dịch) — KHÔNG cần sửa code hay build lại image.
#
# Format mỗi dòng: "tên gốc tiếng Trung": "tên/biệt danh tiếng Việt chuẩn". Bị dịch/echo sai 1
# tên riêng nào thì thêm dòng tương ứng ở đây là đủ, không cần đụng translate_cli.py.
#
# Không liệt kê hết MỌI nhân vật/biệt danh của Tam Quốc (hàng trăm nhân vật lịch sử) hay MỌI
# tiểu thuyết Kim Dung (15 bộ) — chỉ nhân vật/biệt danh chính, nổi bật nhất, tránh rủi ro tự bịa
# tên nhân vật phụ ít người biết. Thiếu tên nào thì extract_name_glossary() (per-video, gọi
# Deepseek) vẫn tự bắt qua như cũ.

